#彩蛋事件
Welthauptstadt_Germania.1.t: "日耳曼尼亚计划——开端"
Welthauptstadt_Germania.1.d: "1936年，柏林夏季奥运会刚刚闭幕，整个德国仍沉浸在向世界展示崛起形象的兴奋之中。就在这一年，希特勒正式签署法令，启动代号为“世界之都日耳曼尼亚”的千年工程，委任阿尔伯特·施佩尔为帝国首都建筑总监。计划的核心是彻底重塑柏林，将其打造为未来千年帝国的绝对权力中心。一条南北纵贯的五公里长胜利大道划定出城市的脊骨，南起新勃兰登堡门，北抵计划中可容纳十八万人的人民大厅，大道另一端则矗立高达一百一十七米的巨型凯旋门。为保障工程建设，纳粹政权从一开始便实行价格控制，冻结建材与劳动力成本，防止通货膨胀吞噬预算。同期，全国性扩大资源开采计划启动，赫尔曼·戈林工厂开始大规模供应建筑用钢与人造石料。数百万张日耳曼尼亚渲染图被分发到学校与街头，宣传机器称之为元首之梦，宣告柏林将不再是一座普通首都，而是全世界必须仰望的种族与文明圣殿。"
Welthauptstadt_Germania.1.t.a: "多么宏伟的计划！"
Welthauptstadt_Germania.2.t: "日耳曼尼亚计划——中期"
Welthauptstadt_Germania.2.d: "进入1937年，日耳曼尼亚的工地成为整个帝国最大的施工场域。胜利大道的地基工程已全线贯通，凯旋门巨大的混凝土基础在旧城心脏中凝固成型。人民大厅进入主体施工，一座直径二百五十米的环形承重墙从柏林沙质土壤中升起，赫尔曼·戈林工厂为此专门研发了高强度特种钢材，以支撑史无前例的巨大穹顶。全国采石场在自给自足的努力政策下昼夜不休，花岗岩与大理石经帝国高速公路网络和铁路源源不断运抵柏林。与此同时，初步建成帝国工业的战略目标与日耳曼尼亚计划深度咬合：为首都供应建材成为整个帝国工业体系运转的核心任务之一。至年中，成千上万的工人、技师与工程师以轮班制不间断施工，施佩尔将其称为“德意志效率的最高体现”。旧的柏林逐渐消失，整片街区被拆除清理，而整个社会在重视基建的宣传中，将这一摧毁与重建视为民族复兴的必经历程。"
Welthauptstadt_Germania.2.t.a: "进展顺利！"
Welthauptstadt_Germania.3.t: "日耳曼尼亚计划——后期"
Welthauptstadt_Germania.3.d: "1938年成为日耳曼尼亚计划的决定性年份。人民大厅的穹顶在这一年春天正式合龙，巨大的弧形钢骨在柏林天际线中勾勒出前所未有的轮廓，即便尚未覆面，其体量已让所有接近者屏息。凯旋门完成全部结构施工，浮雕刻画着德意志神话与历史叙事。胜利大道两侧的帝国总理府、最高人民法庭与军事纪念堂等建筑群外立面次第完工。施佩尔提出“废墟价值理论”，宣称这些建筑即使千年之后风化为废墟，也将如古罗马遗迹般壮丽，这更加强化了建筑形式的神圣性。同年，力量来自欢乐汽车厂正式更名为大众汽车厂，首辆KdF-Wagen（即甲壳虫原型车）在刚刚竣工的沃尔夫斯堡工厂下线，被宣传为未来日耳曼尼亚大道上的人民汽车。至年底，世界之都核心轴线已基本建成，仅剩内部装饰与广场铺设的最后工序。"
Welthauptstadt_Germania.3.t.a: "接近完成了！"
Welthauptstadt_Germania.4.t: "日耳曼尼亚计划——结束"
Welthauptstadt_Germania.4.d: "1939年4月20日，希特勒五十岁生日当天，世界之都日耳曼尼亚举行盛大落成典礼。清晨，元首在凯旋门前检阅国防军与武装党卫队方阵，正午时分步入人民大厅。十八万个座席被纳粹官员、各国使节、军人代表与外国记者填满，希特勒在高达二百九十米的穹顶阴影下发表演说，宣告“千年帝国从此拥有了匹配的心脏”。入夜，数百台防空探照灯沿人民大厅外环垂直投射，构成施佩尔设计的“光之穹顶”，光线直冲夜空，远在数十公里外仍清晰可见。胜利大道两侧灯火通明，首条大众汽车车流从勃兰登堡门方向缓缓驶入轴心大道，象征民众已拥有了通向世界之都的现代通道。全球舆论被这超尺度的奇观所震动，无论是盟友还是潜在敌手，都在这一刻意识到，一个前所未见的建筑威权时代已经降临。元首之梦至此彻底化为混凝土与花岗岩的现实，柏林不再是昨日的城市，而是一台被注入纳粹灵魂的巨大仪式机器，以沉默而永恒的姿态，开始向世界宣告它的存在。"
Welthauptstadt_Germania.4.t.a: "世界之都日耳曼尼亚！"